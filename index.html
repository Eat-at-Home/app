<title>Eat@Home</title>

<style>
/* Layout: white editorial blog copied from the supplied template. Header with search, thin nav, full-width hero with an overlapping white feature card, then a three-column recipe grid. Square edges, yellow accent used only for actions. Single light look on purpose, like the template. Arabic mirrors the whole layout (dir=rtl) with Naskh headings and Cairo body text. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --card: #ffffff;
  --ink: #1d1d20;
  --muted: #6e6e75;
  --line: #ebebed;
  --tint: #f2f2f3;
  --accent: #fbe45c;
  --accent-ink: #1d1d20;
  --p-bg: #eeeeef;
  --p-dish: #ffffff;
  --p-ring: #e4e4e6;
  --p-dot: #7c7c82;
  --serif: 'Merriweather', Georgia, 'Times New Roman', serif;
  --sans: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --script: 'Mrs Saint Delafield', 'Brush Script MT', cursive;
}
:root[dir="rtl"] {
  --serif: 'Noto Naskh Arabic', 'Merriweather', 'Traditional Arabic', Georgia, serif;
  --sans: 'Cairo', 'Montserrat', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.65; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 887px; margin-inline: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* header */
.top { display: grid; grid-template-columns: auto minmax(200px, 1fr) auto; gap: 20px; align-items: center; padding-block: 22px; }
.logo { position: relative; display: block; justify-self: start; }
.logo .word { font-size: 25px; font-weight: 400; letter-spacing: 0.06em; line-height: 1; white-space: nowrap; display: block; direction: ltr; }
.search { display: flex; align-items: stretch; background: var(--tint); padding: 3px; max-width: 420px; width: 100%; justify-self: center; }
.sel { position: relative; display: flex; align-items: center; }
.sel select { appearance: none; -webkit-appearance: none; background: transparent; border: 0; padding-block: 0; padding-inline: 14px 28px; height: 100%; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; max-width: 130px; }
.sel svg { position: absolute; inset-inline-end: 10px; pointer-events: none; width: 11px; height: 11px; }
.search input { flex: 1; min-width: 0; border: 0; background: var(--card); padding: 11px 14px; font-size: 12px; margin-inline-start: 2px; }
.search input::placeholder { color: var(--muted); }
.search .go { width: 44px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.search .go svg { width: 15px; height: 15px; }
.tools { display: flex; align-items: center; gap: 12px; }
.admin-tag { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--tint); font-size: 9.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 6px 8px; white-space: nowrap; }
.admin-tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1px var(--ink); }
.tool:has(+ .add:not([hidden])) { padding-inline-end: 12px; border-inline-end: 1px solid var(--line); }
.nav .star { display: inline-block; width: 5px; height: 5px; background: var(--accent); border-radius: 50%; vertical-align: top; margin-block: -2px 0; margin-inline: 4px 0; }
.tool { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; font-size: 12px; padding: 6px 0; white-space: nowrap; }
.tool[aria-pressed="true"] { font-weight: 600; }
.tool[aria-pressed="true"] svg { fill: currentColor; }
.lang { font-weight: 600; border: 1px solid var(--line); padding: 6px 10px; }
.lang:hover { border-color: var(--ink); }
.add { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 12px 14px; white-space: nowrap; }
.nav { display: flex; gap: 30px; border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { font-size: 10.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; padding: 22px 0 20px 0; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.nav a[aria-current="page"] { border-bottom-color: var(--accent); }
.nav a:hover { border-bottom-color: var(--line); }
.nav a[aria-current="page"]:hover { border-bottom-color: var(--accent); }

/* hero */
.hero { position: relative; background: var(--p-bg); min-height: 410px; overflow: hidden; margin-top: 0; }
.hero-media { position: absolute; inset: 0; }
.hero-media img, .hero-media svg { display: block; width: 100%; height: 100%; object-fit: cover; }
.hero-inner { position: relative; padding-block: 72px; }
.hero-card { background: var(--card); width: min(366px, 100%); padding: 34px 26px 26px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta svg { color: var(--muted); }
.hero-card h1 { font-family: var(--serif); font-weight: 400; font-size: 36px; line-height: 1.17; letter-spacing: -0.01em; margin: 18px 0 14px; text-wrap: balance; }
.hero-card p.lead { color: var(--muted); font-size: 12.5px; margin: 0 0 24px; }
.hero-card .cta { display: inline-block; margin-bottom: 22px; }

/* byline */
.byline { display: flex; align-items: center; gap: 12px; }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #2a2a2e; flex: none; }
.by-name { font-size: 9.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.5; }
.by-date { font-size: 10.5px; color: var(--muted); line-height: 1.4; }
.actions { margin-inline-start: auto; display: flex; gap: 8px; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--ink); }
.icon-btn:hover { border-color: var(--muted); }
.icon-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.icon-btn[aria-pressed="true"] svg { fill: currentColor; }

/* sections */
main { min-height: 40vh; }
.section { padding-block: 56px 20px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
.section-head h2 { font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 1.25; margin: 0; letter-spacing: -0.01em; }
.label { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
.more { font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; border-bottom: 2px solid var(--accent); padding-bottom: 2px; white-space: nowrap; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 44px 32px; }
.card { min-width: 0; display: flex; flex-direction: column; }
.card-img { position: relative; display: block; flex: none; width: 100%; aspect-ratio: 262 / 182; background: var(--p-bg); overflow: hidden; margin-bottom: 20px; }
.card-img > img, .card-img > svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
.badge svg { position: static; width: 12px; height: 12px; }
.badge { position: absolute; top: 0; inset-inline-start: 0; background: var(--accent); color: var(--accent-ink); font-size: 9.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; }
.card h3 { font-family: var(--serif); font-weight: 400; font-size: 18px; line-height: 1.45; margin: 14px 0 10px; text-wrap: balance; }
.card h3 a:hover, .hero-card h1 a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 4px; }
.excerpt { color: var(--muted); font-size: 12px; margin: 0 0 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .byline { margin-top: auto; }

/* categories + chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
.chip { border: 1px solid var(--line); background: var(--card); font-size: 10.5px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; padding: 9px 14px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.tile { text-align: start; border: 1px solid var(--line); background: var(--card); padding: 26px 22px 22px; display: flex; flex-direction: column; gap: 22px; min-height: 130px; }
.tile:hover { border-color: var(--ink); }
.tile b { font-family: var(--serif); font-weight: 400; font-size: 20px; line-height: 1.3; }
.tile small { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: auto; }
.video { display: flex; align-items: center; gap: 18px; background: var(--ink); color: #ffffff; padding: 18px 22px; margin: 0 0 14px; max-width: 460px; }
.video-url { margin: 0 0 40px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.video-url .ghost { padding: 7px 12px; }
.video:hover { background: #000000; }
.video .play { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.video .play svg { width: 18px; height: 18px; margin-left: 2px; }
.video b { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
.video small { font-size: 11px; opacity: 0.75; }
.chip-label { align-self: center; margin-inline-end: 6px; color: var(--muted); }
.chips.cuisine { margin-top: -18px; }
.all { margin: 44px 0 0; text-align: center; }
.a-text { font-size: 13px; color: var(--muted); margin: 0 0 20px; max-width: 52ch; line-height: 1.7; }
.adminlink { border: 0; background: none; padding: 0; font-size: 11px; letter-spacing: 0.04em; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.adminlink[data-on="1"] { color: var(--ink); font-weight: 600; text-decoration: none; }
.adminlink[data-on="1"]::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-inline-end: 8px; }
.empty { border: 1px dashed var(--muted); padding: 44px 24px; text-align: center; color: var(--muted); }
.empty h3 { font-family: var(--serif); font-weight: 400; font-size: 20px; color: var(--ink); margin: 0 0 8px; }
.empty p { margin: 0 auto 20px; max-width: 46ch; font-size: 12.5px; }
.empty .add { margin-inline: auto; }
.note { background: var(--tint); font-size: 11.5px; padding: 10px 14px; margin-top: 28px; color: var(--muted); }
.note.tr { margin: 0 0 28px; }

/* recipe page */
.crumb { display: inline-flex; align-items: center; gap: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 28px; }
.detail { padding-block: 40px 20px; }
.detail h1 { font-family: var(--serif); font-weight: 400; font-size: 38px; line-height: 1.25; letter-spacing: -0.01em; margin: 18px 0 20px; text-wrap: balance; max-width: 22ch; }
.detail .byline { max-width: 460px; margin-bottom: 30px; }
.detail-img { position: relative; aspect-ratio: 16 / 8; max-height: 460px; width: 100%; background: var(--p-bg); overflow: hidden; margin-bottom: 36px; }
.detail-img img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
.detail-lead { font-family: var(--serif); font-size: 16px; line-height: 1.8; max-width: 62ch; margin: 0 0 40px; color: var(--ink); }
.cols { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 48px; align-items: start; }
.box { background: var(--tint); padding: 26px 24px; }
.box h2, .steps-wrap h2 { font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 18px; }
.ing { list-style: none; margin: 0; padding: 0; }
.ing li { padding: 9px 0; border-bottom: 1px solid var(--line); }
.ing li:last-child { border-bottom: 0; }
.ing label { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; font-size: calc(13px * var(--fs, 1)); }
.textsize { display: flex; align-items: center; gap: 8px; margin: 0 0 22px; }
.textsize .label { margin-inline-end: 6px; }
.textsize .ghost { min-width: 44px; padding: 9px 12px; font-size: 12px; letter-spacing: 0; }
.ing input { margin-top: 5px; accent-color: var(--ink); }
.ing input:checked + span { text-decoration: line-through; color: var(--muted); }
.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 26px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 16px; font-size: calc(14px * var(--fs, 1)); line-height: 1.8; }
.steps li::before { content: counter(s); width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.owner-bar { display: flex; gap: 10px; margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.ghost { border: 1px solid var(--line); background: var(--card); font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 11px 16px; }
.ghost:hover { border-color: var(--ink); }
.ghost:disabled { opacity: 0.55; cursor: default; }
.ghost.danger { color: #b3261e; }
.about p { font-family: var(--serif); font-size: 16px; line-height: 1.85; max-width: 60ch; margin: 0 0 18px; }
.stats { display: flex; gap: 40px; flex-wrap: wrap; margin-top: 36px; padding-top: 28px; border-top: 1px solid var(--line); }
.stats div b { display: block; font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stats div span { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

footer { margin-top: 80px; border-top: 1px solid var(--line); padding-block: 28px 40px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; letter-spacing: 0.04em; }

/* modal form */
#modal { position: fixed; inset: 0; z-index: 50; background: rgba(12, 12, 14, 0.6); overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel { background: var(--card); max-width: 720px; margin: 24px auto; padding: 32px 30px 28px; }
.panel h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; margin: 0 0 24px; }
.field { display: grid; gap: 7px; margin-bottom: 18px; min-width: 0; }
.field > label, .field > .lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
.field small { color: var(--muted); font-size: 11px; }
.field input[type="text"], .field input[type="number"], .field input[type="password"], .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--card); padding: 11px 12px; font-size: 13px; border-radius: 0; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--ink); outline-offset: 0; border-color: var(--ink); }
.field textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pair > div { display: grid; gap: 5px; min-width: 0; align-content: start; }
.pair .sub { font-size: 11px; font-weight: 600; color: var(--muted); }
.trbar { background: var(--tint); padding: 14px 16px; margin: 0 0 22px; display: grid; gap: 10px; }
.trbar p { margin: 0; font-size: 12px; color: var(--muted); }
.trbar .btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.photo { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.photo img { width: 120px; height: 84px; object-fit: cover; display: block; }
.check { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-bottom: 22px; }
.check input { accent-color: var(--ink); width: 16px; height: 16px; }
.form-foot { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.err { color: #b3261e; font-size: 12px; margin: 0 0 14px; min-height: 0; }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 12px; padding: 11px 18px; z-index: 60; max-width: min(90vw, 520px); overflow-wrap: anywhere; }

/* Arabic (right-to-left) */
:root[dir="rtl"] body { font-size: 15px; line-height: 1.8; }
:root[dir="rtl"] * { letter-spacing: 0 !important; text-transform: none !important; }
:root[dir="rtl"] .logo .word { letter-spacing: 0.06em !important; text-transform: none !important; }

:root[dir="rtl"] .section-head h2 { line-height: 1.5; }
:root[dir="rtl"] .meta, :root[dir="rtl"] .by-name, :root[dir="rtl"] .by-date, :root[dir="rtl"] .label, :root[dir="rtl"] .tile small, :root[dir="rtl"] .stats div span { font-size: 12px; }
:root[dir="rtl"] .nav a, :root[dir="rtl"] .more, :root[dir="rtl"] .chip, :root[dir="rtl"] .ghost, :root[dir="rtl"] .add, :root[dir="rtl"] .crumb { font-size: 13px; }
:root[dir="rtl"] .sel select, :root[dir="rtl"] .admin-tag, :root[dir="rtl"] .badge { font-size: 12px; }
:root[dir="rtl"] .excerpt { font-size: 14px; }
:root[dir="rtl"] .tool, :root[dir="rtl"] .search input { font-size: 13px; }
:root[dir="rtl"] .field > label, :root[dir="rtl"] .field > .lbl { font-size: 12px; }
:root[dir="rtl"] .field small, :root[dir="rtl"] .note, :root[dir="rtl"] .trbar p { font-size: 12.5px; }
:root[dir="rtl"] .ing label { font-size: calc(15px * var(--fs, 1)); }
:root[dir="rtl"] .steps li { font-size: calc(16px * var(--fs, 1)); }

@media (max-width: 860px) {
  .grid, .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) and (min-width: 641px) {
  .top { grid-template-columns: minmax(0, 1fr) auto; gap: 16px 16px; }
  .search { grid-column: 1 / -1; grid-row: 2; max-width: none; }
}
@media (max-width: 720px) {

  .hero-media { position: relative; height: 240px; }
  .hero-inner { padding-block: 0 8px; margin-top: -44px; }
  .hero-card { width: 100%; padding: 26px 22px 22px; }
  .hero-card h1, :root[dir="rtl"] .hero-card h1 { font-size: 26px; }
  .cols { grid-template-columns: minmax(0, 1fr); gap: 36px; }
  .detail h1 { font-size: 30px; }
  .detail-img { aspect-ratio: 16 / 10; }
  .section { padding-top: 40px; }
  .tools { gap: 14px; }
}
@media (max-width: 640px) {

}

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

  /* ---------- storage ---------- */
  function loadLocal() {
    try { var a = JSON.parse(lsGet("eh-recipes") || "[]"); if (Array.isArray(a)) state.recipes = a; } catch (e) { state.recipes = []; }
  }
  function persistLocal() { return lsSet("eh-recipes", JSON.stringify(state.recipes)); }

  function persist(id, data) {
    if (state.mode === "db") return state.db.collection("recipes").doc(id).set(data);
    data.id = id;
    var i = state.recipes.findIndex(function (r) { return r.id === id; });
    if (i >= 0) state.recipes[i] = data; else state.recipes.push(data);
    if (!persistLocal()) return Promise.reject(new Error(t("noRoom")));
    return Promise.resolve();
  }
  function removeRecipe(id) {
    var p;
    if (state.mode === "db") p = state.db.collection("recipes").doc(id).delete();
    else { state.recipes = state.recipes.filter(function (r) { return r.id !== id; }); persistLocal(); p = Promise.resolve(); }
    p.then(function () { state.confirmDel = ""; toast(t("deleted")); go("#recipes"); }, function () { toast(t("deleteFail")); });
  }

  /* ---------- form ---------- */
  function lines(s) { return String(s || "").split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean); }
  function newId() { return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function pairInput(id, label, en, arv, rows, phEn, phAr, max) {
    var tag = rows ? "textarea" : "input";
    function ctl(cid, val, dir, lang, ph) {
      return rows
        ? '<textarea id="' + cid + '" rows="' + rows + '" dir="' + dir + '" lang="' + lang + '" placeholder="' + esc(ph) + '"' + (max ? ' maxlength="' + max + '"' : "") + ">" + esc(val) + "</textarea>"
        : '<input id="' + cid + '" type="text" dir="' + dir + '" lang="' + lang + '" value="' + esc(val) + '" placeholder="' + esc(ph) + '"' + (max ? ' maxlength="' + max + '"' : "") + ">";
    }
    return '<div class="field"><span class="lbl">' + esc(label) + '</span><div class="pair">' +
      '<div><label class="sub" for="' + id + '" lang="en" dir="ltr">English</label>' + ctl(id, en, "ltr", "en", phEn) + "</div>" +
      '<div><label class="sub" for="' + id + '-ar" lang="ar" dir="rtl">العربية</label>' + ctl(id + "-ar", arv, "rtl", "ar", phAr) + "</div></div>" +
      (arguments[8] ? "<small>" + esc(arguments[8]) + "</small>" : "") + "</div>";
  }

  function openForm(r) {
    state.editing = r; state.img = r && hasImg(r) ? r.image : ""; state.saving = false;
    var v = r || { title: "", titleAr: "", summary: "", summaryAr: "", category: "Dinner", minutes: 30, level: "Easy", cuisine: "", ingredients: [], ingredientsAr: [], steps: [], stepsAr: [], author: state.author, popular: false };
    function opts(arr, cur, lab) { return arr.map(function (x) { return '<option value="' + esc(x) + '"' + (x === cur ? " selected" : "") + ">" + esc(lab(x)) + "</option>"; }).join(""); }
    var trbar = state.sample ? '<div class="trbar"><p>' + esc(t("trHint")) + '</p><div class="btns"><button class="ghost" type="button" data-tr="en-ar">' + esc(t("trToAr")) + '</button><button class="ghost" type="button" data-tr="ar-en">' + esc(t("trToEn")) + '</button><span class="label" id="tr-status" role="status"></span></div></div>' : "";
    modal.innerHTML = '<div class="panel" role="dialog" aria-modal="true" aria-labelledby="f-head"><h2 id="f-head">' + esc(r ? t("formEdit") : t("formAdd")) + "</h2>" +
      '<form id="recipe-form" novalidate>' + trbar +
      pairInput("f-title", t("fTitle"), v.title, v.titleAr || "", 0, t("phTitleEn"), t("phTitleAr"), 140) +
      '<div class="row"><div class="field"><label for="f-cat">' + esc(t("fCat")) + '</label><select id="f-cat">' + opts(CATS, v.category, catLabel) + "</select></div>" +
      '<div class="field"><label for="f-min">' + esc(t("fMin")) + '</label><input id="f-min" type="number" min="1" max="1440" value="' + esc(v.minutes || "") + '"></div>' +
      '<div class="field"><label for="f-level">' + esc(t("fLevel")) + '</label><select id="f-level">' + opts(LEVELS, v.level, levelLabel) + "</select></div></div>" +
      '<div class="field"><label for="f-cui">' + esc(t("fCui")) + '</label><input id="f-cui" type="text" list="cui-list" value="' + esc(cuisineLabel(v.cuisine || "")) + '" placeholder="' + esc(t("fCuiPh")) + '" maxlength="40" autocomplete="off"><datalist id="cui-list">' + allCuisines().map(function (c) { return '<option value="' + esc(cuisineLabel(c)) + '"></option>'; }).join("") + "</datalist><small>" + esc(t("fCuiHint")) + "</small></div>" +
      pairInput("f-sum", t("fSum"), v.summary || "", v.summaryAr || "", 3, t("phSumEn"), t("phSumAr"), 400) +
      pairInput("f-ing", t("fIng"), (v.ingredients || []).join("\n"), (v.ingredientsAr || []).join("\n"), 6, S.phIngEn[0], S.phIngAr[0], 0, t("fIngHint")) +
      pairInput("f-steps", t("fSteps"), (v.steps || []).join("\n"), (v.stepsAr || []).join("\n"), 6, S.phStepsEn[0], S.phStepsAr[0], 0, t("fStepsHint")) +
      '<div class="field"><label for="f-yt">' + esc(t("fVideo")) + '</label><input id="f-yt" type="text" inputmode="url" dir="ltr" value="' + esc(videoOf(v) ? videoOf(v).url : "") + '" placeholder="' + esc(t("fVideoPh")) + '" autocomplete="off"><small>' + esc(t("fVideoHint")) + "</small></div>" +
      '<div class="field"><span class="lbl">' + esc(t("fPhoto")) + '</span><div class="photo" id="photo-box"></div><small>' + esc(t("fPhotoHint")) + "</small></div>" +
      '<div class="row2"><div class="field"><label for="f-author">' + esc(t("fByline")) + '</label><input id="f-author" type="text" dir="auto" value="' + esc(v.author) + '" maxlength="60" placeholder="' + esc(t("fBylinePh")) + '"></div><div></div></div>' +
      '<label class="check"><input id="f-pop" type="checkbox"' + (v.popular ? " checked" : "") + "> " + esc(t("fPop")) + "</label>" +
      '<p class="err" id="f-err" role="alert"></p>' +
      '<div class="form-foot"><button class="add" type="submit" id="f-save">' + esc(t("saveRecipe")) + '</button><button class="ghost" type="button" id="f-cancel">' + esc(t("cancel")) + "</button></div>" +
      "</form></div>";
    modal.hidden = false;
    drawPhoto();
    $("#f-cancel").addEventListener("click", closeForm);
    $("#recipe-form").addEventListener("submit", submitForm);
    $("#f-title").focus();
  }
  function closeForm() { modal.hidden = true; modal.innerHTML = ""; state.editing = null; }
  modal.addEventListener("mousedown", function (e) { if (e.target === modal) closeForm(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !modal.hidden) closeForm(); });

  function drawPhoto() {
    var box = $("#photo-box"); if (!box) return;
    box.innerHTML = (state.img ? '<img src="' + state.img + '" alt="' + esc(t("selPhoto")) + '">' : "") +
      '<input id="f-img" type="file" accept="image/*" aria-label="' + esc(t("choosePhoto")) + '">' +
      (state.img ? '<button class="ghost" type="button" id="f-noimg">' + esc(t("removePhoto")) + "</button>" : "");
    $("#f-img").addEventListener("change", function (e) {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      shrink(f).then(function (d) { state.img = d; drawPhoto(); }, function (er) { $("#f-err").textContent = (er && er.message) || t("errPhotoRead"); });
    });
    var rm = $("#f-noimg"); if (rm) rm.addEventListener("click", function () { state.img = ""; drawPhoto(); });
  }
  function shrink(file) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onerror = function () { rej(new Error(t("errPhotoRead"))); };
      fr.onload = function () {
        var im = new Image();
        im.onerror = function () { rej(new Error(t("errPhotoType"))); };
        im.onload = function () {
          var sizes = [1000, 800, 640], out = "";
          for (var s = 0; s < sizes.length; s++) {
            var k = Math.min(1, sizes[s] / Math.max(im.width, im.height));
            var c = document.createElement("canvas"); c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
            c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
            for (var q = 0.8; q >= 0.5; q -= 0.1) { out = c.toDataURL("image/jpeg", q); if (out.length < 190000) return res(out); }
          }
          rej(new Error(t("errPhotoBig")));
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  /* translate one language into the other with Claude (page owner only, on a click) */
  function doTranslate(dir) {
    if (!state.sample || state.translating) return;
    var from = dir === "en-ar" ? "" : "-ar", to = dir === "en-ar" ? "-ar" : "";
    var g = function (id) { return $("#" + id).value; };
    var src = { title: g("f-title" + from).trim(), summary: g("f-sum" + from).trim(), ingredients: lines(g("f-ing" + from)), steps: lines(g("f-steps" + from)) };
    var st = $("#tr-status");
    if (!src.title && !src.summary && !src.ingredients.length && !src.steps.length) { st.textContent = dir === "en-ar" ? t("trNeedEn") : t("trNeedAr"); return; }
    state.translating = true; st.textContent = t("trBusy");
    document.querySelectorAll("[data-tr]").forEach(function (b) { b.disabled = true; });
    var names = dir === "en-ar" ? ["English", "Arabic"] : ["Arabic", "English"];
    var prompt = "Translate this home-cooking recipe from " + names[0] + " to " + names[1] + ". Reply with only a JSON object with exactly these keys: title (string), summary (string), ingredients (array of strings), steps (array of strings). Keep the same number of items, in the same order, in ingredients and steps. Keep quantities and units correct, keep an empty string empty, and use natural everyday wording for a home recipe blog" + (dir === "en-ar" ? " (clear Modern Standard Arabic, Western digits 0-9)" : "") + ".\n\nRecipe:\n" + JSON.stringify(src);
    state.sample.json(prompt, { modelTier: "default" }).then(function (out) {
      if (!out || typeof out !== "object") throw { code: "invalid_json" };
      var list = function (a) { return Array.isArray(a) ? a.map(function (x) { return String(x); }).join("\n") : ""; };
      if ($("#f-title" + to)) {
        $("#f-title" + to).value = String(out.title || "");
        $("#f-sum" + to).value = String(out.summary || "");
        $("#f-ing" + to).value = list(out.ingredients);
        $("#f-steps" + to).value = list(out.steps);
        var s2 = $("#tr-status"); if (s2) s2.textContent = t("trDone");
      }
    }).catch(function (e) {
      var s2 = $("#tr-status"); if (!s2) return;
      var c = e && e.code;
      s2.textContent = c === "not_granted" || c === "sampling_disabled" || c === "not_declared" ? t("trDeclined") : c === "rate_limited" ? t("trRate") : t("trFail");
    }).then(function () {
      state.translating = false;
      document.querySelectorAll("[data-tr]").forEach(function (b) { b.disabled = false; });
    });
  }

  function submitForm(e) {
    e.preventDefault();
    if (state.saving) return;
    var err = $("#f-err"); err.textContent = "";
    var title = $("#f-title").value.trim(), titleAr = $("#f-title-ar").value.trim();
    if (!title && !titleAr) { err.textContent = t("errTitle"); $("#f-title").focus(); return; }
    var vidRaw = $("#f-yt").value.trim(), vid = parseVideo(vidRaw);
    if (vidRaw && !vid) { err.textContent = t("errVideo"); $("#f-yt").focus(); return; }
    var old = state.editing;
    var data = {
      title: title, titleAr: titleAr, category: $("#f-cat").value, cuisine: cuisineKey($("#f-cui").value), video: vid ? vid.url : "", minutes: parseInt($("#f-min").value, 10) || 0, level: $("#f-level").value,
      summary: $("#f-sum").value.trim(), summaryAr: $("#f-sum-ar").value.trim(),
      ingredients: lines($("#f-ing").value), ingredientsAr: lines($("#f-ing-ar").value),
      steps: lines($("#f-steps").value), stepsAr: lines($("#f-steps-ar").value),
      image: state.img || "", author: $("#f-author").value.trim(), popular: $("#f-pop").checked,
      createdAt: old && old.createdAt ? old.createdAt : new Date().toISOString(), updatedAt: new Date().toISOString()
    };
    var id = old ? old.id : newId();
    state.author = data.author; lsSet("eh-author", data.author);
    state.saving = true; $("#f-save").disabled = true;
    persist(id, data).then(function () {
      state.saving = false; closeForm(); toast(t("saved"));
      if (state.mode === "local") renderView();
      if (!old) go("#recipe-" + id); else renderView();
    }, function (er) {
      state.saving = false; var b = $("#f-save"); if (b) b.disabled = false;
      var m = er && er.code === "quota_exceeded" ? t("errQuota") : (er && er.message) || t("errSave");
      if ($("#f-err")) $("#f-err").textContent = m;
    });
  }

  /* ---------- admin lock ---------- */
  function b64(buf) { var a = new Uint8Array(buf), s = ""; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function derive(pw, salt, iter) {
    if (!(window.crypto && crypto.subtle)) return Promise.reject(new Error(t("noCryptoCheck")));
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]).then(function (k) {
      return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: salt, iterations: iter }, k, 256);
    });
  }
  function closeBtn() { return '<button class="ghost" type="button" data-aclose>' + esc(t("close")) + "</button>"; }
  function openAdmin() {
    var h = '<div class="panel" role="dialog" aria-modal="true" aria-labelledby="a-head"><h2 id="a-head">' + esc(t("adminTitle")) + "</h2>", focus = "";
    if (state.mode !== "db" || !state.canWrite) {
      h += '<p class="a-text">' + esc(state.mode !== "db" ? t("adminLocal") : t("adminNoAccess")) + '</p><div class="form-foot">' + closeBtn() + "</div>";
    } else if (!state.lockLoaded) {
      h += '<p class="a-text">' + esc(t("adminChecking")) + '</p><div class="form-foot">' + closeBtn() + "</div>";
    } else if (hasLock() && !state.unlocked) {
      h += '<form id="a-unlock" novalidate><div class="field"><label for="a-pw">' + esc(t("adminPw")) + '</label><input id="a-pw" type="password" autocomplete="current-password"></div><p class="err" id="a-err" role="alert"></p><div class="form-foot"><button class="add" type="submit">' + esc(t("unlock")) + '</button><button class="ghost" type="button" data-aclose>' + esc(t("cancel")) + "</button></div></form>";
      focus = "#a-pw";
    } else {
      var has = hasLock();
      h += '<p class="a-text">' + esc(has ? t("adminOpen") : t("adminNoPw")) + "</p>" +
        '<form id="a-set" novalidate><div class="field"><label for="a-new">' + esc(has ? t("newPw") : t("pw")) + '</label><input id="a-new" type="password" autocomplete="new-password"><small>' + esc(t("pwHint")) + "</small></div>" +
        '<div class="field"><label for="a-new2">' + esc(t("pwRepeat")) + '</label><input id="a-new2" type="password" autocomplete="new-password"></div><p class="err" id="a-err" role="alert"></p>' +
        '<div class="form-foot"><button class="add" type="submit">' + esc(has ? t("changePw") : t("setPw")) + "</button>" +
        (has ? '<button class="ghost" type="button" data-alock>' + esc(t("lockNow")) + '</button><button class="ghost danger" type="button" data-aremove>' + esc(t("removePw")) + "</button>" : "") +
        closeBtn() + "</div></form>" +
        '<p class="a-text" style="margin:22px 0 0">' + esc(t("pwNote")) + "</p>";
      focus = "#a-new";
    }
    modal.innerHTML = h + "</div>"; modal.hidden = false;
    var uf = $("#a-unlock"); if (uf) uf.addEventListener("submit", doUnlock);
    var sf = $("#a-set"); if (sf) sf.addEventListener("submit", doSetPassword);
    var f = focus ? $(focus) : $("[data-aclose]"); if (f) f.focus();
  }
  function doUnlock(e) {
    e.preventDefault();
    var er = $("#a-err"); er.textContent = "";
    if (Date.now() < state.until) { er.textContent = t("tooMany"); return; }
    var pw = $("#a-pw").value; if (!pw) { er.textContent = t("enterPw"); return; }
    Promise.resolve().then(function () { return derive(pw, unb64(state.lock.salt), state.lock.iter || 200000); }).then(function (bits) {
      if (b64(bits) === state.lock.hash) { state.fails = 0; state.unlocked = true; closeForm(); toast(t("tUnlocked")); renderView(); }
      else { state.fails++; if (state.fails >= 5) { state.until = Date.now() + 30000; state.fails = 0; } er.textContent = t("wrongPw"); $("#a-pw").select(); }
    }, function (x) { er.textContent = (x && x.message) || t("pwCheckFail"); });
  }
  function doSetPassword(e) {
    e.preventDefault();
    var er = $("#a-err"); er.textContent = "";
    var p1 = $("#a-new").value, p2 = $("#a-new2").value;
    if (p1.length < 6) { er.textContent = t("pwShort"); return; }
    if (p1 !== p2) { er.textContent = t("pwMismatch"); return; }
    if (!(window.crypto && crypto.getRandomValues)) { er.textContent = t("noCryptoSet"); return; }
    var salt = crypto.getRandomValues(new Uint8Array(16));
    derive(p1, salt, 200000).then(function (bits) {
      return state.db.doc("settings/lock").set({ salt: b64(salt), hash: b64(bits), iter: 200000, updatedAt: new Date().toISOString() });
    }).then(function () { state.unlocked = true; closeForm(); toast(t("tPwSaved")); renderView(); }, function (x) { er.textContent = (x && x.message) || t("pwSaveFail"); });
  }
  modal.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-aclose],[data-alock],[data-aremove],[data-tr]"); if (!b) return;
    if (b.hasAttribute("data-tr")) doTranslate(b.getAttribute("data-tr"));
    else if (b.hasAttribute("data-aclose")) closeForm();
    else if (b.hasAttribute("data-alock")) { state.unlocked = false; closeForm(); toast(t("tLocked")); renderView(); }
    else state.db.doc("settings/lock").delete().then(function () { state.lock = null; state.unlocked = false; closeForm(); toast(t("tPwRemoved")); renderView(); }, function () { var er = $("#a-err"); if (er) er.textContent = t("pwRemoveFail"); });
  });
  $("#admin-btn").addEventListener("click", openAdmin);
  $("#admin-tag").addEventListener("click", openAdmin);

  /* ---------- boot ---------- */
  loadLocal();
  renderView();

  (async function () {
    var db = null, user = null;
    try { if (window.claude && window.claude.use) { db = await window.claude.use("db"); user = await window.claude.use("user"); } } catch (e) { db = null; }
    if (!db) { state.mode = "local"; state.canWrite = true; state.checked = true; renderView(); return; }
    state.mode = "db"; state.db = db; state.recipes = [];
    try { state.canWrite = user ? await user.canEdit() : false; } catch (e) { state.canWrite = false; }
    try { var me = user ? await user.me() : null; if (me && me.name && !state.author) state.author = me.name; } catch (e) {}
    if (state.canWrite) { try { state.sample = await window.claude.use("sample"); } catch (e) { state.sample = null; } }
    state.checked = true;
    if (state.canWrite) {
      db.doc("settings/lock").onSnapshot(function (snap) {
        state.lock = snap.exists ? snap.data() : null; state.lockLoaded = true; renderView();
      }, function () { renderView(); });
    }
    renderView();
    db.collection("recipes").onSnapshot(function (snap) {
      state.recipes = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
      renderView();
    }, function () { renderView(); });
  })();
})();
</script>

</body></html>
